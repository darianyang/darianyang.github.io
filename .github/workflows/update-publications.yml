name: Update Publications from Google Scholar

on:
  # Run automatically on the 1st of every month at 06:00 UTC
  #schedule:
  #  - cron: '0 6 1 * *'
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  update_publications:
    runs-on: ubuntu-latest
    name: Fetch Scholar profile and update publications.html

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script
        run: python scripts/update_publications.py --html publications.html

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update publications from Google Scholar"
            git push
          fi
